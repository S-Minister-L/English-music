<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文歌自学分享 · English Song Learning</title>

  <!-- ============================================================
       CDN 引入 Supabase JS（云端留言板，无需本地安装）
       ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============================================================
       全局变量 · 浅色护眼配色
       ============================================================ */
    :root {
      --bg: linear-gradient(135deg, #fdf2f8 0%, #eef6ff 45%, #f5f3ff 100%); /* 页面背景 */
      --card: rgba(255, 255, 255, 0.78);        /* 卡片背景 */
      --card-strong: rgba(255, 255, 255, 0.92);
      --text: #2c3e50;        /* 主文字 */
      --text-soft: #6b7280;   /* 次要文字 */
      --primary: #4f46e5;     /* 主色调（按钮/链接） */
      --primary-soft: #eef2ff;/* 主色浅底 */
      --border: rgba(148, 163, 184, 0.28);      /* 边框 */
      --basic: #2563eb;       /* 基础词高亮（蓝色） */
      --basic-bg: #eff6ff;
      --advanced: #db2777;    /* 高级语法词高亮（粉红） */
      --advanced-bg: #fdf2f8;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --radius: 10px;
    }

    /* ============================================================
       基础重置
       ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(251, 207, 232, 0.8), transparent 38%),
        radial-gradient(circle at 85% 16%, rgba(147, 197, 253, 0.45), transparent 34%),
        linear-gradient(135deg, #fdf2f8 0%, #eef6ff 45%, #f5f3ff 100%);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px; /* 给底部悬浮按钮留空间 */
      min-height: 100%;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -1;
      filter: blur(70px);
      opacity: 0.8;
    }
    body::before {
      top: -8%; left: -8%;
      width: 32vw; height: 32vw;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: float-soft 16s ease-in-out infinite alternate;
    }
    body::after {
      right: -6%; bottom: -10%;
      width: 36vw; height: 36vw;
      background: rgba(191, 219, 254, 0.45);
      border-radius: 50%;
      animation: float-soft 20s ease-in-out infinite alternate-reverse;
    }
    @keyframes float-soft {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(24px, -22px, 0) scale(1.08); }
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, textarea, select {
      font-family: inherit; font-size: 14px;
      padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; outline: none; width: 100%;
      background: rgba(255, 255, 255, 0.9); color: var(--text);
      backdrop-filter: blur(8px);
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
    }
    textarea { resize: vertical; min-height: 80px; }

    /* ============================================================
       顶部导航条
       ============================================================ */
    .topbar {
      background: var(--card-strong);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 16px;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 12px 30px rgba(76, 82, 125, 0.08);
      backdrop-filter: blur(16px);
    }
    .topbar .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
    .topbar .search {
      flex: 1; max-width: 420px; position: relative;
    }
    .topbar .search input { padding-left: 32px; }
    .topbar .search::before {
      content: "🔍"; position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%); font-size: 13px; opacity: .6;
    }
    .topbar .nav-btns { margin-left: auto; display: flex; gap: 8px; }

    /* ============================================================
       通用按钮
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 8px 14px; border-radius: 6px;
      font-size: 14px; font-weight: 500; transition: all .15s;
      background: #f3f4f6; color: var(--text);
    }
    .btn:hover { background: #e5e7eb; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); }
    .btn-ghost:hover { background: #f9fafb; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ============================================================
       主容器 + 侧边栏贴左布局
       原则：侧边栏完全贴 viewport 左边缘，正文区域有舒适的阅读宽度与留白
       ============================================================ */
    /* 侧边栏：固定定位，左侧紧贴屏幕边缘；顶栏之下、全屏高度 */
    .sidebar {
      position: fixed; left: 0; top: 61px; bottom: 0;
      width: 252px;
      background: rgba(255, 255, 255, 0.7);
      border-right: 1px solid var(--border);
      padding: 22px 16px 16px;
      overflow-y: auto;
      z-index: 30;
      backdrop-filter: blur(16px);
    }
    .sidebar .sb-title {
      font-size: 12px; font-weight: 700; color: var(--text-soft);
      padding: 0 6px 12px; text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid var(--border); margin-bottom: 10px;
    }
    .cat-list { display: flex; flex-direction: column; gap: 3px; }
    .cat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      font-size: 14px; color: var(--text); transition: background .15s;
      user-select: none;
    }
    .cat-item:hover { background: #f3f4f6; }
    .cat-item.active {
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      color: var(--primary); font-weight: 600;
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .cat-item .label {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-right: 8px;
    }
    .cat-item .count {
      background: #e5e7eb; color: var(--text-soft);
      font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500;
      min-width: 20px; text-align: center;
    }
    .cat-item.active .count { background: var(--primary); color: #fff; }
    .cat-item.unc-zero { opacity: .55; }
    .sb-sep { height: 1px; background: var(--border); margin: 12px 6px; }
    .sb-footer {
      font-size: 11px; color: var(--text-soft);
      padding: 8px 8px 2px; line-height: 1.6;
    }

    /* 主内容区：桌面端左偏移避免被侧边栏遮挡 */
    .layout {
      display: block;
      margin-left: 252px;
      padding: 28px 40px 48px;
      max-width: 1120px;
    }
    /* 后台：无边栏，内容居中，宽度更宽松 */
    body.view-admin .layout,
    .admin-mode { margin-left: 0 !important; padding: 20px 40px 60px; max-width: 1200px; }

    /* 主容器移除原 padding（由 layout 负责） */
    .container { padding: 0; max-width: none; }

    /* 移动端汉堡按钮 */
    .sb-toggle {
      display: none;
      position: fixed; left: 12px; top: 72px; z-index: 80;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 12px; cursor: pointer;
      box-shadow: var(--shadow); font-size: 14px;
    }
    .sb-backdrop {
      display: none;
      position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 40;
    }

    /* 搜索栏 + 当前分类提示 */
    .search-area {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 22px;
    }
    .search-area .search { flex: 1; }
    .current-cat-hint {
      font-size: 13px; color: var(--text-soft);
      white-space: nowrap;
      padding: 4px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
    }
    .current-cat-hint b { color: var(--primary); font-weight: 600; }

    /* 卡片网格 gap 加大，卡片更宽松 */
    .song-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }
    /* 后台视图：#app 无侧边栏，左右留白加大居中 */
    .view-admin { padding: 28px 48px 60px; max-width: 1200px; margin: 0 auto; }

    .song-card {
      background: var(--card); border-radius: var(--radius);
      padding: 20px 18px; box-shadow: 0 10px 24px rgba(76, 82, 125, 0.08);
      cursor: pointer; transition: transform .15s, box-shadow .15s;
      border: 1px solid rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
    }
    .song-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
      border-color: var(--primary-soft);
    }
    .song-card .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .song-card .artist { font-size: 13px; color: var(--text-soft); margin-bottom: 12px; }
    .song-card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-block; padding: 3px 9px; font-size: 11px;
      background: var(--primary-soft); color: var(--primary);
      border-radius: 10px;
    }
    .count-badge {
      display: inline-block; padding: 2px 9px; font-size: 11px; font-weight: 500;
      background: #e5e7eb; color: var(--text-soft); border-radius: 999px;
    }
    .empty-state {
      text-align: center; padding: 80px 20px; color: var(--text-soft);
    }
    .empty-state .big { font-size: 56px; margin-bottom: 12px; }

    /* ============================================================
       单曲学习页布局（留白加大，阅读舒适）
       ============================================================ */
    .learn-header { margin-bottom: 26px; }
    .learn-header .back { margin-bottom: 12px; }
    .learn-header h1 { font-size: 26px; margin-bottom: 6px; }
    .learn-header .artist { color: var(--text-soft); font-size: 14px; }

    /* 播放器容器：横向布局，体积小巧，下方留白加大 */
    .players {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-bottom: 32px; align-items: flex-start; justify-content: flex-start;
    }
    .player-box {
      background: var(--card); border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow);
      /* 响应式：允许放大，桌面端最大 760px，移动端不小于 320px */
      flex: 1 1 480px; max-width: 760px; min-width: 320px;
    }
    .player-box .label {
      font-size: 12px; color: var(--text-soft);
      margin-bottom: 8px; display: flex; align-items: center; gap: 4px;
    }
    .player-box .label .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
    }

    /* B站 iframe 强制缩小尺寸（电脑最大400px、移动端自适应） */
    .bili-wrap {
      position: relative; width: 100%;
      padding-top: 56.25%; /* 16:9 比例不变形 */
      border-radius: 6px; overflow: hidden;
      background: #000;
    }
    .bili-wrap iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* 兜底提示框（播放器加载失败时显示） */
    .fallback {
      display: none; padding: 12px; background: #fef3c7;
      border: 1px solid #fde68a; border-radius: 6px;
      font-size: 13px; color: #92400e; text-align: center;
    }
    .fallback.show { display: block; }
    .fallback a {
      display: inline-block; margin-top: 6px;
      padding: 4px 10px; background: #92400e; color: #fff;
      border-radius: 4px; text-decoration: none; font-size: 12px;
    }
    .fallback a:hover { background: #78350f; }

    /* ============================================================
       歌词区（留白加大，行距更舒展）
       ============================================================ */
    .lyrics-toolbar {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .lyrics-toolbar .mode-switch {
      display: inline-flex; background: #e5e7eb; border-radius: 8px; padding: 3px;
    }
    .lyrics-toolbar .mode-switch button {
      padding: 7px 14px; font-size: 13px; background: transparent;
      color: var(--text-soft); border-radius: 6px;
    }
    .lyrics-toolbar .mode-switch button.active {
      background: #fff; color: var(--primary); box-shadow: var(--shadow);
    }
    .lyrics-box {
      background: var(--card); border-radius: var(--radius);
      padding: 32px 36px; box-shadow: var(--shadow);
      font-size: 16px; line-height: 2.2;
    }
    .lyrics-line { margin-bottom: 10px; }
    .lyrics-line .zh {
      display: block; color: var(--text-soft); font-size: 13px;
      margin-top: 3px; line-height: 1.6;
    }
    /* 高亮单词样式：基础词蓝色、高级语法词粉红 */
    .hl {
      cursor: pointer; border-radius: 3px; padding: 1px 3px;
      border-bottom: 2px dotted; transition: background .15s;
      position: relative;
    }
    .hl.basic { color: var(--basic); background: var(--basic-bg); border-color: var(--basic); }
    .hl.advanced { color: var(--advanced); background: var(--advanced-bg); border-color: var(--advanced); }
    .hl:hover { filter: brightness(.95); }

    /* ============================================================
       批注弹窗（悬浮显示，轻薄简洁）
       ============================================================ */
    .anno-pop {
      position: fixed; z-index: 100;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      max-width: 320px; min-width: 200px;
      font-size: 13px; display: none;
    }
    .anno-pop.show { display: block; }
    .anno-pop .word {
      font-size: 16px; font-weight: 600; color: var(--text);
    }
    .anno-pop .phon { color: var(--text-soft); font-style: italic; margin-left: 6px; }
    .anno-pop .row { margin-top: 6px; }
    .anno-pop .row .k {
      font-size: 11px; color: var(--text-soft);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .anno-pop .row .v { color: var(--text); }
    .anno-pop .close {
      position: absolute; top: 6px; right: 8px;
      cursor: pointer; color: var(--text-soft); font-size: 14px;
    }

    /* ============================================================
       留言板（Supabase 云端）：留白更舒适
       ============================================================ */
    .msg-board {
      background: var(--card); border-radius: var(--radius);
      padding: 24px 26px; box-shadow: var(--shadow);
      margin-top: 32px;
    }
    .msg-board h2 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
    .msg-form { display: grid; gap: 10px; margin-bottom: 20px; }
    .msg-form .nick { max-width: 260px; }
    .msg-form textarea { min-height: 70px; }
    .msg-form .actions { display: flex; justify-content: flex-end; }
    .msg-list { display: flex; flex-direction: column; gap: 12px; }
    .msg-item {
      padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: #fafafa;
    }
    .msg-item .head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px; flex-wrap: wrap;
    }
    .msg-item .nick {
      font-weight: 600; color: var(--primary); font-size: 14px;
    }
    .msg-item .time { font-size: 12px; color: var(--text-soft); }
    .msg-item .body { font-size: 14px; color: var(--text); word-break: break-word; }
    .msg-item .del {
      margin-left: auto; font-size: 12px; color: var(--danger);
      background: transparent; cursor: pointer; padding: 2px 6px;
      border-radius: 4px;
    }
    .msg-item .del:hover { background: #fee2e2; }
    .msg-loading, .msg-empty {
      text-align: center; color: var(--text-soft); font-size: 13px;
      padding: 16px;
    }

    /* ============================================================
       悬浮切换按钮（前台/后台）
       ============================================================ */
    .float-btn {
      position: fixed; right: 20px; bottom: 20px; z-index: 200;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--primary); color: #fff;
      box-shadow: 0 4px 12px rgba(79,70,229,.4);
      font-size: 22px; display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .float-btn:hover { transform: scale(1.08); }

    /* ============================================================
       Toast 轻提示
       ============================================================ */
    #toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 999; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      background: rgba(17,24,39,.92); color: #fff;
      padding: 10px 18px; border-radius: 6px; font-size: 14px;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      animation: toastIn .2s ease;
    }
    .toast-item.success { background: var(--success); }
    .toast-item.error { background: var(--danger); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       模态弹窗（用于批注编辑、密码登录等）
       ============================================================ */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 300; display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--card); border-radius: var(--radius);
      padding: 20px; width: 100%; max-width: 480px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
      max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 12px; }
    .modal .form-row { margin-bottom: 12px; }
    .modal .form-row label {
      display: block; font-size: 13px; color: var(--text-soft);
      margin-bottom: 4px;
    }
    .modal .actions {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;
    }

    /* ============================================================
       管理员后台（整体加宽留白）
       ============================================================ */
    .admin-tabs {
      display: flex; gap: 6px; border-bottom: 1px solid var(--border);
      margin-bottom: 24px; overflow-x: auto;
    }
    .admin-tabs button {
      padding: 12px 18px; background: transparent; color: var(--text-soft);
      border-bottom: 2px solid transparent; white-space: nowrap;
      font-size: 14px;
    }
    .admin-tabs button.active {
      color: var(--primary); border-bottom-color: var(--primary); font-weight: 600;
    }
    .admin-panel { background: var(--card); border-radius: var(--radius); padding: 26px 28px; box-shadow: var(--shadow); }
    .admin-panel h2 { font-size: 18px; margin-bottom: 18px; }
    .form-grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { font-size: 13px; color: var(--text-soft); display: block; margin-bottom: 4px; }
    .form-grid .hint { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

    /* 后台列表条目留白放大 */
    .admin-list { display: flex; flex-direction: column; gap: 10px; }
    .admin-list-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
    }
    .admin-list-item .info { flex: 1; }
    .admin-list-item .info .t { font-weight: 600; margin-bottom: 3px; }
    .admin-list-item .info .s { font-size: 12px; color: var(--text-soft); }
    .admin-list-item .ops { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    /* 批注编辑器：左侧歌词、右侧批注列表 */
    .anno-editor { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    .anno-editor .lyrics-area {
      background: #fafafa; padding: 20px; border-radius: 10px;
      border: 1px solid var(--border); line-height: 2.1;
      min-height: 320px; white-space: pre-wrap; user-select: text;
    }
    .anno-editor .lyrics-area::selection { background: var(--primary-soft); }
    .anno-editor .anno-list { display: flex; flex-direction: column; gap: 10px; max-height: 540px; overflow-y: auto; }
    .anno-card {
      background: #fafafa; border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; font-size: 13px;
    }
    .anno-card .w { font-weight: 600; color: var(--primary); }
    .anno-card .ops { margin-top: 6px; display: flex; gap: 4px; }

    /* 备份区 */
    .backup-box { display: flex; flex-direction: column; gap: 12px; }
    .backup-box .row {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      border: 1px dashed var(--border); border-radius: 8px;
    }

  function safeLocalGet(key, fallback = null) {
    try { return localStorage.getItem(key); } catch (e) { return fallback; }
  }
  function safeLocalSet(key, value) {
    try { localStorage.setItem(key, value); return true; }
    catch (e) { console.warn('localStorage 写入失败：', e); return false; }
  }
  function safeSessionGet(key, fallback = null) {
    try { return sessionStorage.getItem(key); } catch (e) { return fallback; }

   * 写入：
   *   - 管理员在后台操作 → 优先调用 Supabase RPC（写云端，所有人实时同步），

   *   - 如果 SHARED_SONGS 有内容 → 先作为种子写入 Supabase，之后用 Supabase 为准
   * ============================================================ */
  const CLOUD_READ_TIMEOUT = 4000;     // 云端读取超时时间（毫秒）
  let _cloudStatus = null;            // 'online' | 'offline' | null（尚未检测）
  let _pendingCloudSeed = false;      // 正在向 Supabase 写入 SHARED_SONGS 种子

  // ---- 低阶：Supabase 云端直接读（Promise，超时拒绝）----
  function _cloudLoadSongs() {
    return new Promise(async (resolve, reject) => {
      const client = initSupabase();
      if (!client) return reject(new Error('NO_CLIENT'));
      const timer = setTimeout(() => reject(new Error('TIMEOUT')), CLOUD_READ_TIMEOUT);
      try {
        const { data, error } = await client
          .from('songs')
          .select('id, title, artist, category, bilibili_bv, lyrics, lyrics_zh, annotations')
          .order('updated_at', { ascending: false });
        clearTimeout(timer);
        if (error) return reject(error);
        // 字段名归一化（Supabase 列名 snake_case → 前端 camelCase）
        const list = (data || []).map(s => ({
          id: s.id,
          title: s.title,
          artist: s.artist,
          category: s.category || '',
          bilibiliBV: s.bilibili_bv || '',
          lyrics: s.lyrics || '',
          lyricsZh: s.lyrics_zh || '',
          annotations: Array.isArray(s.annotations) ? s.annotations : []
        }));
        resolve(list);
      } catch (e) { clearTimeout(timer); reject(e); }
    });
  }
  function _cloudLoadCategories() {
    return new Promise(async (resolve, reject) => {
      const client = initSupabase();
      if (!client) return reject(new Error('NO_CLIENT'));
      const timer = setTimeout(() => reject(new Error('TIMEOUT')), CLOUD_READ_TIMEOUT);
      try {
        const { data, error } = await client
          .from('categories')
          .select('name, sort_order')
          .order('sort_order', { ascending: true });
        clearTimeout(timer);
        if (error) return reject(error);
        resolve((data || []).map(c => c.name).filter(n => n && typeof n === 'string'));
      } catch (e) { clearTimeout(timer); reject(e); }
    });
  }

  // ---- 读取（Supabase 优先 + localStorage 缓存兜底 + 超时降级）----
  let _songsCache = null;   // 页面生命周期内的内存缓存（避免重复请求数据库）
  async function loadSongsAsync() {
    if (_songsCache) return _songsCache.slice();
    try {
      const cloud = await _cloudLoadSongs();
      _cloudStatus = 'online';
      const normalized = normalizeSongs(cloud || []);
      if (normalized.list && normalized.list.length > 0) {
        _songsCache = normalized.list.map(s => ({ ...s, annotations: (s.annotations || []).map(a => ({ ...a })) }));
        // 顺便缓存一份到 localStorage（下次 Supabase 挂了也能用）
        safeLocalSet(STORE_KEY, JSON.stringify(_songsCache));
        return _songsCache.slice();
      }
      // Supabase 有了但 songs 表为空 → 用 SHARED_SONGS 种子写入
      if (SHARED_SONGS.length > 0 && !_pendingCloudSeed) {
        _pendingCloudSeed = true;
        console.log('[数据] Supabase songs 为空，写入 SHARED_SONGS 种子（', SHARED_SONGS.length, '首）');
        await seedCloudWithSharedSongs();
        _songsCache = SHARED_SONGS.map(s => ({ ...s, annotations: (s.annotations || []).map(a => ({...a})) }));
        return _songsCache.slice();
      }
      // 空数组也行，让 seedDemoIfEmpty 判断后可能从 localStorage 初始化
      return cloud.slice();
    } catch (e) {
      _cloudStatus = 'offline';
      console.warn('[数据] 云端读取 songs 失败，降级到 localStorage：', e.message || e.code || e);
      // 降级：读 localStorage，并用当前 SHARED_SONGS 覆盖同名歌曲，避免旧缓存只显示两条批注
      const local = loadSongsLocal();
      const normalized = normalizeSongs(local || []);
      if (normalized.changed) {
        safeLocalSet(STORE_KEY, JSON.stringify(normalized.list));
      }
      _songsCache = normalized.list.map(s => ({ ...s, annotations: (s.annotations || []).map(a => ({ ...a })) }));
      return _songsCache.slice();
    }
  }

  // 纯本地读（离线兜底使用；保留给 seedDemoIfEmpty 等老代码）
  function loadSongsLocal() {
    try {
      const raw = safeLocalGet(STORE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  // 同步形式的 loadSongs（用于不支持 async 的老代码）：
  //  如果内存缓存有值就返回；否则先读 localStorage 作为占位，后台异步加载云端。
  function loadSongs() {
    if (_songsCache) return _songsCache.slice();
    const local = loadSongsLocal();
    // 触发一次云端异步拉取（不阻塞），成功后自动刷新页面
    loadSongsAsync().then(list => {
      if (!_songsCache || _songsCache.length !== list.length) {
        // 只有当云端数据比本地新（或有差异）时才触发重渲染
        const changed = list.length !== local.length ||
          JSON.stringify(list.slice(0,3).map(s=>s.id)) !== JSON.stringify(local.slice(0,3).map(s=>s.id));
        if (changed) { _songsCache = list; try { render(); } catch(_){} }
      }
    }).catch(()=>{});
    return local;
  }

      return cloud.slice();
    } catch (e) {
      _cloudStatus = 'offline';
      console.warn('[数据] 云端读取 categories 失败，降级：', e.message || e.code);
      return loadCategoriesLocal();
    }
  }
  function loadCategoriesLocal() {
    try {
      const raw = safeLocalGet(CAT_KEY);
      if (!raw) return DEFAULT_CATEGORIES.slice();
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return DEFAULT_CATEGORIES.slice();
      return arr.filter(s => typeof s === 'string' && s.trim().length > 0);
    } catch (e) { return DEFAULT_CATEGORIES.slice(); }
  }
  function loadCategories() {
    const local = loadCategoriesLocal();
    loadCategoriesAsync().then(cloud => {
      if (cloud.length > 0 && JSON.stringify(cloud) !== JSON.stringify(local)) {
        safeLocalSet(CAT_KEY, JSON.stringify(cloud));
        try { render(); } catch(_){}
      }
    }).catch(()=>{});
    return local;
  }

  // ---- 写入（管理员时走 Supabase RPC，同时缓存本地；非管理员只写本地）----
  async function saveSongs(list) {
    // 1. 无论如何都缓存本地（离线兜底 + 页面下次打开不白屏）
    if (!safeLocalSet(STORE_KEY, JSON.stringify(list))) {
      toast('本地保存失败（隐私模式？）', 'error');
    }
    _songsCache = list.slice();
    // 2. 管理员才写云端
    if (!isAdmin) return;
    const client = initSupabase();
    if (!client) return;
    // 逐条通过 write_song RPC 写入（失败就 toast，不阻断其他）
    let ok = 0, failed = 0;
    for (const s of list) {
      try {
        const { error } = await client.rpc('write_song', {
          pwd: ADMIN_PASSWORD,
          song_id: s.id,
          song_title: s.title,
          song_artist: s.artist,
          song_category: s.category || '',
          song_bv: s.bilibiliBV || '',
          song_lyrics: s.lyrics || '',
          song_lyrics_zh: s.lyricsZh || '',
          song_annotations: s.annotations || []
        });
        if (error) throw error;
        ok++;
      } catch (e) {
        failed++;
        console.error('云端保存失败：', s.title, e);
      }
    }
    if (failed > 0) {
      const info = parseSupabaseError({ code: 'CLOUD_WRITE_FAIL' });
      toast(`云端同步：成功 ${ok} 首，失败 ${failed} 首（${info.title}）`, 'error');
    }
  }

  async function saveCategories(list) {
    safeLocalSet(CAT_KEY, JSON.stringify(list));
    if (!isAdmin) return;
    const client = initSupabase();
    if (!client) return;
    try {
      const { error } = await client.rpc('replace_all_categories', {
        pwd: ADMIN_PASSWORD,
        cat_names: list
      });
      if (error) throw error;
    } catch (e) {
      const info = parseSupabaseError(e);
      toast('分类保存到云端失败：' + info.title, 'error');
      if (info.hint) toast('提示：' + info.hint, 'error');
    }
  }

  // ---- 单首删除（后台用）----
  async function deleteSongCloud(songId) {
    const client = initSupabase();
    if (!client) return { ok: false };
    try {
      const { error } = await client.rpc('delete_song', {
        pwd: ADMIN_PASSWORD, song_id: songId
      });
      if (error) throw error;
      return { ok: true };
    } catch (e) {
      console.error('云端删除失败：', e);
      const info = parseSupabaseError(e);
      toast('云端删除失败：' + info.title, 'error');
      return { ok: false, error: info };
    }
  }

  // ---- 种子写入（Supabase 首次为空时写入 SHARED_SONGS/CATEGORIES）----
  async function seedCloudWithSharedSongs() {

  // 生成唯一ID
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  // 把一个分类名映射为用于展示的友好名（向后兼容：空值 → 未分类）
  function getCategoryDisplayName(name) {
    if (!name || !name.trim()) return VCAT_UNCATEGORIZED;
    return name;
  }
  // 判断某分类是否是虚拟分类（不能被删除/重命名）
  function isVirtualCategory(name) {
    return name === VCAT_ALL || name === VCAT_UNCATEGORIZED;
  }
  // 计算各分类的歌曲数量 { 分类名: 数量 }（包含 全部歌曲 / 未分类）
  function computeCategoryCounts(songs) {
    const map = {};
    for (const s of songs) {
      const k = getCategoryDisplayName(s.category);
      map[k] = (map[k] || 0) + 1;
    }
    map[VCAT_ALL] = songs.length;
    if (!map[VCAT_UNCATEGORIZED]) map[VCAT_UNCATEGORIZED] = 0;
    return map;
  }
  // 增加分类：重复则返回 false
  function addCategory(newName) {
    newName = (newName || '').trim();
    if (!newName) { toast('分类名不能为空', 'error'); return false; }
    if (isVirtualCategory(newName)) { toast('该分类名是保留词，请换一个', 'error'); return false; }
    const list = loadCategories();
    if (list.some(c => c === newName)) { toast('该分类已存在', 'error'); return false; }
    list.push(newName);
    saveCategories(list);
    return true;
  }
  // 重命名分类：同步更新所有 song.category
  function renameCategory(oldName, newName) {
    newName = (newName || '').trim();
    if (!newName) { toast('新分类名不能为空', 'error'); return false; }
    if (isVirtualCategory(oldName)) { toast('系统内置分类不可重命名', 'error'); return false; }
    if (isVirtualCategory(newName)) { toast('新分类名是保留词', 'error'); return false; }
    const list = loadCategories();
    const idx = list.indexOf(oldName);
    if (idx < 0) { toast('原分类不存在', 'error'); return false; }
    if (list.indexOf(newName) >= 0 && newName !== oldName) { toast('新分类名已存在', 'error'); return false; }
    list[idx] = newName;
    saveCategories(list);
    // 同步所有歌曲的分类字段
    const songs = loadSongs();
    let changed = 0;
    for (const s of songs) {
      if (s.category === oldName) { s.category = newName; changed++; }
    }
    if (changed > 0) saveSongs(songs);
    toast(`分类已重命名，${changed} 首歌曲同步更新`, 'success');
    return true;
  }
  // 删除分类：若该分类下有歌曲，移动到未分类
  function deleteCategory(name) {
    if (isVirtualCategory(name)) { toast('系统内置分类不可删除', 'error'); return false; }
    const list = loadCategories();
    const idx = list.indexOf(name);
    if (idx < 0) { toast('分类不存在', 'error'); return false; }
    list.splice(idx, 1);
    saveCategories(list);
    const songs = loadSongs();
    let moved = 0;
    for (const s of songs) {
      if (s.category === name) { s.category = ''; moved++; }
    }
    if (moved > 0) { saveSongs(songs); toast(`已删除「${name}」，${moved} 首歌移动到「未分类」`, 'success'); }
    else toast(`已删除「${name}」`, 'success');
    return true;
  }
  // 上移 / 下移排序（index = 目标分类在列表中的位置）
  function moveCategory(name, direction) {
    const list = loadCategories();
    const idx = list.indexOf(name);
    if (idx < 0) return false;
    const target = idx + direction;
    if (target < 0 || target >= list.length) return false; // 边界
    [list[idx], list[target]] = [list[target], list[idx]];
    saveCategories(list);
    return true;
  }

  /* ============================================================
   * 数据初始化策略（改造后：云端 Supabase 优先）
   * ------------------------------------------------------------
   * seedDemoIfEmpty 不再是实际"初始化歌曲"——
   *   现在歌曲/分类数据从 Supabase 云端读（见 loadSongsAsync），
   *   Supabase 为空时自动用 SHARED_SONGS 作为种子写进云端。
   * seedDemoIfEmpty 的职责：
   *   1) 旧浏览器 localStorage 里有数据 → 保持可读（离线兜底场景）
   *   2) 如果 Supabase 不可用，用 SHARED_SONGS 或示例初始化 localStorage
   * ============================================================ */
  function seedDemoIfEmpty() {
    // 先判断 Supabase 是否可用（初始化过）
    const client = initSupabase();
    if (client) {
      // Supabase 可用 → 在 loadSongsAsync 里自动执行种子写入，这里无需再做
      // 兜底：确保分类不为空（loadCategories 异步读取会覆盖）
      const raw = safeLocalGet(CAT_KEY);
      if (!raw) {
        const initCats = (SHARED_CATEGORIES && SHARED_CATEGORIES.length > 0)
          ? SHARED_CATEGORIES.slice()
          : DEFAULT_CATEGORIES.slice();
        safeLocalSet(CAT_KEY, JSON.stringify(initCats));
      }
      return;
    }
    // === Supabase 不可用（离线/密钥未配置）：完全走 localStorage ===
    const raw = safeLocalGet(CAT_KEY);
    if (!raw) {

        ? SHARED_CATEGORIES.slice()
        : DEFAULT_CATEGORIES.slice();
      safeLocalSet(CAT_KEY, JSON.stringify(initCats));
    }
    const songs = loadSongsLocal();
    // 1b. 兼容性修复：歌曲里缺失的分类自动追加
    if (songs.length > 0) {

      let changed = false;

        const k = (s.category || '').trim();
        if (k && !set.has(k) && !isVirtualCategory(k)) { set.add(k); cats.push(k); changed = true; }
      }
      if (changed) safeLocalSet(CAT_KEY, JSON.stringify(cats));
    }
    if (songs.length > 0) return;   // localStorage 已有歌曲就不用初始化
    if (SHARED_SONGS && SHARED_SONGS.length > 0) {
      const cloned = SHARED_SONGS.map(s => ({
        ...s,
        id: uid(),
        annotations: (s.annotations || []).map(a => ({ ...a, id: uid() }))
      }));

    }
    // 回退示例
    const demo = {

      lyricsZh: '当我年轻时\n我会听收音机\n等待我最爱的歌曲\n当它们播放时我会跟着唱\n那让我微笑',
      annotations: [
        { id: uid(), word: 'listen to', phonetic: '/ˈlɪsən tu/', meaning: '听；倾听', grammar: '动词短语，后接名词或动名词', collocation: 'listen to music / listen carefully', example: 'I like to listen to music before sleep.', level: 'basic' },
        { id: uid(), word: 'favorite', phonetic: '/ˈfeɪvərɪt/', meaning: '最喜爱的', grammar: '形容词，无比较级', collocation: 'favorite song / favorite color', example: 'This is my favorite book.', level: 'basic' },
        { id: uid(), word: 'radio', phonetic: '/ˈreɪdioʊ/', meaning: '收音机；无线电', grammar: '名词', collocation: 'listen to the radio / radio station', example: 'She turned on the radio to hear the news.', level: 'basic' },
        { id: uid(), word: 'play', phonetic: '/pleɪ/', meaning: '播放；演奏', grammar: '动词，可及物/不及物', collocation: 'play a song / play the piano', example: 'They played my favorite song at the party.', level: 'basic' },
        { id: uid(), word: 'sing along', phonetic: '/sɪŋ əˈlɔŋ/', meaning: '跟着唱（与别人一起唱）', grammar: '动词短语', collocation: 'sing along with the radio / sing along to a song', example: 'When the chorus came, everyone began to sing along.', level: 'basic' },
        { id: uid(), word: 'smile', phonetic: '/smaɪl/', meaning: '微笑；露出笑容', grammar: '动词/名词', collocation: 'give a smile / smile at someone', example: 'Her smile brightened up the room.', level: 'basic' }

  /* ============================================================
   * 自动版本同步：让老访客刷新就能看到你更新的歌曲
   * ------------------------------------------------------------
   * 工作原理：
   *   1. 你更新 SHARED_SONGS 后，把 SHARED_VERSION 改成更大的数字
   *   2. 老访客刷新时，对比 localStorage 里的版本号 vs SHARED_VERSION
   *   3. 版本号不一致 → 自动合并：
   *      - SHARED_SONGS 里有但老访客没有的歌 → 追加
   *      - SHARED_SONGS 里有且老访客也有的歌 → 用新版覆盖（你改的歌词会同步）
   *      - 老访客自己加的歌 → 保留不动
   *   4. 更新 localStorage 里的版本号
   * ============================================================ */
  const SHARED_VERSION_KEY = 'esl_shared_version';

  /* ============================================================
   * ID 归一化（解决重复 Yesterday Once More 的核心）
   * ------------------------------------------------------------
   * 问题场景：
   *   旧版 seedDemoIfEmpty 生成的 Yesterday Once More 的 ID 叫 old-msl...
   *   SHARED_SONGS 里写入的 ID 叫 mslze3h0cy7chm
   *   → 两首歌 ID 不同 → 被当成两首不同的歌 → 重复显示
   *
   * 去重规则：按「歌名(大小写不敏感) + 歌手(大小写不敏感)」配对
   *   如果 SHARED_SONGS 里能找到「同歌名+同歌手」的歌，就用
   *   SHARED_SONGS 的那条作为"权威版本"，替换掉本地那条（ID 也同步成
   *   SHARED_SONGS 的 ID），这样两首歌会合并成一首，不再重复。
   *
   * 同时移除「完全相同歌名+歌手」的重复（本地两首自己重复的情况）。
   * ============================================================ */
  function normalizeSongs(songs) {
    if (!songs || songs.length === 0) return { list: songs, changed: false, dedupCount: 0 };
    // key = 歌名|歌手（都 trim 后转小写，方便比较）
    const keyOf = s => `${(s.title || '').trim().toLowerCase()}|${(s.artist || '').trim().toLowerCase()}`;
    // 1. 先构建 SHARED_SONGS 的权威映射（key → SHARED_SONGS 的整首对象）
    const sharedByKey = new Map();
    for (const s of SHARED_SONGS || []) sharedByKey.set(keyOf(s), s);

    const result = [];
    const seenKeys = new Map();   // key → 已放入 result 的索引
    let changed = false;
    let dedupCount = 0;

    for (const song of songs) {
      const key = keyOf(song);
      // 2. 如果 SHARED_SONGS 里有同 key 的权威版本 → 用权威版本替换（ID/歌词/分类都会统一）
      if (sharedByKey.has(key)) {
        const auth = sharedByKey.get(key);
        // 深拷贝，避免引用污染
        const replaced = {
          ...auth,
          annotations: (auth.annotations || []).map(a => ({ ...a }))
        };
        if (seenKeys.has(key)) {
          // 3. 本地已经有同 key 的歌了 → 这一条是重复的，跳过（去重计数 +1）
          dedupCount++;
          changed = true;
          continue;
        }
        // 检查是否真的需要替换（ID 相同就不用浪费）
        if (replaced.id !== song.id) changed = true;
        result.push(replaced);
        seenKeys.set(key, result.length - 1);
        continue;
      }
      // 4. SHARED_SONGS 里没有 → 检查本地是不是重复了
      if (seenKeys.has(key)) {
        dedupCount++;
        changed = true;
        continue;
      }
      result.push(song);
      seenKeys.set(key, result.length - 1);
    }
    return { list: result, changed, dedupCount };
  }

  function syncSharedData() {
    // =============================================================
    // 改造后：如果 Supabase 可用，数据的"唯一真相来源"就是云端数据库
    // → 不需要再做 SHARED_VERSION / 本地合并（loadSongsAsync 已经拉取云端）
    // → 这里的 syncSharedData 只负责「离线兜底场景」和「第一次切换云端前的本地区域归一化」
    // =============================================================
    const client = initSupabase();
    if (client) {
      // Supabase 可用：只做一次本地 localStorage 归一化（避免以后离线打开时看到重复）
      // 但不写入 Supabase（云端来源就是权威，不把本地可能混乱的数据写回去）
      const songs = loadSongsLocal();
      const norm = normalizeSongs(songs);
      if (norm.changed) {
        safeLocalSet(STORE_KEY, JSON.stringify(norm.list));
        if (norm.dedupCount > 0) console.log(`[归一化] 本地离线缓存合并 ${norm.dedupCount} 首重复`);
      }
      // 版本号标记为当前版本（免得以后离线打开再重复跑）
      if (SHARED_VERSION) safeLocalSet(SHARED_VERSION_KEY, String(SHARED_VERSION));
      return;
    }

    // === 离线/未配置密钥：保留原来的完整合并逻辑 ===
    if (SHARED_SONGS.length === 0) return;
    const storedVersion = parseInt(safeLocalGet(SHARED_VERSION_KEY) || '0', 10);
    let songs = loadSongsLocal();

    const norm = normalizeSongs(songs);
    if (norm.changed) {
      songs = norm.list;
      safeLocalSet(STORE_KEY, JSON.stringify(songs));
      const keptCats = new Set();
      for (const s of songs) if (s.category) keptCats.add(s.category);
      const sharedCatSet = new Set(SHARED_CATEGORIES || []);
      const curCats = loadCategoriesLocal();
      const newCats = curCats.filter(c =>
        isVirtualCategory(c) || sharedCatSet.has(c) || keptCats.has(c)
      );
      if (newCats.length !== curCats.length) safeLocalSet(CAT_KEY, JSON.stringify(newCats));
      if (norm.dedupCount > 0) toast(`🔧 自动归一化：已合并 ${norm.dedupCount} 首重复歌曲`, 'success');
    }

    const sharedMap = new Map(SHARED_SONGS.map(s => [s.id, s]));
    let hasReplace = false;
    let mergedBase = songs.map(s => {
      if (!sharedMap.has(s.id)) return s;
      const shared = sharedMap.get(s.id);
      hasReplace = true;
      return { ...shared, annotations: (shared.annotations || []).map(a => ({ ...a })) };
    });
    const existingIds = new Set(mergedBase.map(s => s.id));
    const toAdd = SHARED_SONGS.filter(s => !existingIds.has(s.id));
    if (toAdd.length > 0) {
      for (const s of toAdd) {
        mergedBase.push({ ...s, annotations: (s.annotations || []).map(a => ({ ...a })) });
      }
      hasReplace = true;
    }
    if (hasReplace) safeLocalSet(STORE_KEY, JSON.stringify(mergedBase));

    if (SHARED_CATEGORIES.length > 0) {
      const cats = loadCategoriesLocal();
      const set = new Set(cats);
      let catChanged = false;
      for (const c of SHARED_CATEGORIES) {
        if (!set.has(c) && !isVirtualCategory(c)) { set.add(c); cats.push(c); catChanged = true; }
      }
      if (catChanged) safeLocalSet(CAT_KEY, JSON.stringify(cats));
    }

    if (SHARED_VERSION && storedVersion < SHARED_VERSION) {
      safeLocalSet(SHARED_VERSION_KEY, String(SHARED_VERSION));
      console.log(`[自动同步(离线)] 已更新到版本 ${SHARED_VERSION}`);
    }
  }

  /* ============================================================
   * 第二部分：轻提示 Toast
   * ============================================================ */
  function toast(msg, type = '') {
    const el = document.createElement('div');
    el.className = 'toast-item ' + type;
    el.textContent = msg;
    document.getElementById('toast').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s';
      setTimeout(() => el.remove(), 300); }, 2200);
  }

  /* ============================================================
   * 第三部分：模态弹窗
   * ============================================================ */
  function openModal(html) {
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modalMask').classList.add('show');
  }
  function closeModal() {
    document.getElementById('modalMask').classList.remove('show');
    document.getElementById('modalBox').innerHTML = '';
  }
  document.getElementById('modalMask').addEventListener('click', e => {
    if (e.target.id === 'modalMask') closeModal();
  });

  /* ============================================================
   * 第四部分：视图路由（前台列表 / 前台学习页 / 后台）
   *   通过内存状态切换，无页面刷新
   * ============================================================ */
  let currentView = 'home';     // home | learn | admin
  let currentSongId = null;
  let isAdmin = safeSessionGet(AUTH_KEY) === '1';
  let lyricsMode = 'bilingual'; // bilingual(中英对照) | en(纯英文)
  let currentCategory = VCAT_ALL;  // 当前侧边栏激活分类
  let sidebarOpen = false;         // 移动端侧边栏开/关

  // 侧边栏 HTML 构建：在首页/学习页显示；后台不显示
  function buildSidebarHtml() {
    const songs = loadSongs();
    const counts = computeCategoryCounts(songs);
    const userCats = loadCategories();
    // 侧边栏展示顺序：全部歌曲 → 用户自定义分类 → 未分类
    const items = [
      { name: VCAT_ALL, virtual: true },
      ...userCats.map(c => ({ name: c, virtual: false })),
    ];
    // 未分类仅在数量 > 0 时展示（或有歌曲但 category 不在列表中）
    if (counts[VCAT_UNCATEGORIZED] > 0) items.push({ name: VCAT_UNCATEGORIZED, virtual: true, uncategorized: true });

    const catItems = items.map(it => {
      const cnt = counts[it.name] || 0;
      const active = (currentCategory === it.name) ? 'active' : '';
      const uncZero = (it.uncategorized && cnt === 0) ? 'unc-zero' : '';
      return `
        <div class="cat-item ${active} ${uncZero}" onclick="selectCategory('${escapeAttr(it.name)}')">
          <span class="label">${escapeHtml(it.name)}</span>
          <span class="count">${cnt}</span>
        </div>`;
    }).join('');

    const adminTip = isAdmin
      ? '💡 后台可增删改排序分类'
      : '💡 管理员可在后台添加/编辑分类';

    return `
      <aside class="sidebar ${sidebarOpen ? 'open' : ''}">
        <div class="sb-title">📚 歌曲分类</div>
        <div class="cat-list">${catItems}</div>
        <div class="sb-sep"></div>
        <div class="sb-footer">
          共 ${songs.length} 首歌<br/>
          ${adminTip}
        </div>
      </aside>`;
  }

  // 切分类（路由回首页；搜索词保留，实现叠加过滤）
  function selectCategory(name) {
    currentCategory = name;
    sidebarOpen = false;
    document.getElementById('sbBackdrop').classList.remove('show');
    document.querySelector('.sidebar') && document.querySelector('.sidebar').classList.remove('open');
    if (currentView !== 'home') { currentView = 'home'; }
    render();
  }
  function toggleSidebar(force) {
    sidebarOpen = (force !== undefined) ? force : !sidebarOpen;
    const sb = document.querySelector('.sidebar');
    const bd = document.getElementById('sbBackdrop');
    if (sb) sb.classList.toggle('open', sidebarOpen);
    if (bd) bd.classList.toggle('show', sidebarOpen);
  }

  function render() {
    const app = document.getElementById('app');
    // 给 #app 加视图类名，用于 CSS 根据前台/后台切换 padding / 宽度
    app.className = 'container view-' + currentView;
    // 分类侧边栏 + 汉堡按钮：仅 home/learn 显示，后台隐藏
    const sbHide = document.getElementById('sbToggle');
    if (sbHide) sbHide.style.display = (currentView === 'admin') ? 'none' : '';
    // 后台视图：隐藏左侧侧边栏（避免残留的 fixed sidebar 仍占位）
    const sidebarEl = document.querySelector('.sidebar');
    if (currentView === 'admin') {
      if (sidebarEl) sidebarEl.style.display = 'none';
      const bd = document.getElementById('sbBackdrop');
      if (bd) bd.classList.remove('show');
    } else if (sidebarEl) {
      sidebarEl.style.display = ''; // 恢复
    }

    if (currentView === 'home') {
      renderHome(app);
    } else if (currentView === 'learn') {
      renderLearn(app, currentSongId);
    } else if (currentView === 'admin') {
      renderAdmin(app);
    }
    // 悬浮按钮图标随状态变化
    document.getElementById('floatBtn').textContent = (currentView === 'admin') ? '🏠' : '⚙️';
  }

  // 悬浮按钮点击逻辑：进入后台需密码验证
  document.getElementById('floatBtn').addEventListener('click', () => {
    if (currentView === 'admin') {
      // 当前已在后台，点击返回前台
      currentView = 'home'; render();
    } else {
      // 进入后台：检查登录态
      if (isAdmin) {
        currentView = 'admin'; render();
      } else {
        promptAdminLogin();
      }
    }
  });
  // 顶部首页按钮
  document.getElementById('homeBtn').addEventListener('click', () => {
    currentView = 'home'; render();
  });

  // 搜索框输入：实时过滤
  document.getElementById('searchInput').addEventListener('input', () => {
    if (currentView === 'home') render();
  });

  // 后台密码登录弹窗
  function promptAdminLogin() {
    openModal(`
      <h3>🔐 管理员登录</h3>
      <div class="form-row">
        <label>请输入后台密码（默认：admin）</label>
        <input type="password" id="pwdInput" placeholder="输入密码..." autocomplete="off" />
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="doLogin()">登录</button>
      </div>
    `);
    // 回车提交
    setTimeout(() => {
      const inp = document.getElementById('pwdInput');
      if (inp) {
        inp.focus();
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
      }
    }, 50);
  }
  // 登录验证
  function doLogin() {
    const v = document.getElementById('pwdInput').value;
    if (v === ADMIN_PASSWORD) {
      isAdmin = true;
      safeSessionSet(AUTH_KEY, '1');
      closeModal();
      toast('登录成功，欢迎进入后台', 'success');
      currentView = 'admin'; render();
    } else {
      toast('密码错误', 'error');
    }
  }
  // 退出登录
  function logoutAdmin() {
    isAdmin = false;
    safeSessionRemove(AUTH_KEY);
    currentView = 'home'; render();
    toast('已退出后台');
  }

  /* ============================================================
   * 第五部分：前台 · 歌曲列表页
   * ============================================================ */
  function renderHome(app) {
    const kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    // 第一步：分类过滤（与搜索叠加）
    const catFiltered = loadSongs().filter(s => {
      if (currentCategory === VCAT_ALL) return true;
      if (currentCategory === VCAT_UNCATEGORIZED) {
        return !s.category || s.category.trim() === '';
      }
      return (s.category || '') === currentCategory;
    });
    // 第二步：关键词搜索
    const list = catFiltered.filter(s => {
      if (!kw) return true;
      return (s.title || '').toLowerCase().includes(kw)
          || (s.artist || '').toLowerCase().includes(kw)
          || (s.category || '').toLowerCase().includes(kw);
    });

    const hint = (currentCategory === VCAT_ALL)
      ? `共 ${list.length} 首${kw ? ' 匹配结果' : ''}`
      : `<b>${escapeHtml(currentCategory)}</b> · ${list.length} 首${kw ? ' 匹配' : ''}`;

    if (list.length === 0) {
      app.innerHTML = `
        <div class="layout">
          ${buildSidebarHtml()}
          <div>
            <div class="search-area">
              <div class="current-cat-hint">${hint}</div>
            </div>
            <div class="empty-state">
              <div class="big">🎵</div>
              <div>${(currentCategory !== VCAT_ALL) ? '该分类下暂无歌曲' : (kw ? '没有找到匹配的歌曲' : '还没有歌曲，点击右下角 ⚙️ 进入后台添加')}</div>
            </div>
          </div>
        </div>`;
      return;
    }

    app.innerHTML = `
      <div class="layout">
        ${buildSidebarHtml()}
        <div>
          <div class="search-area">
            <div class="current-cat-hint">${hint}</div>
          </div>
          <div class="song-grid">
            ${list.map(s => `
              <div class="song-card" onclick="goLearn('${s.id}')">
                <div class="title">${escapeHtml(s.title)}</div>
                <div class="artist">${escapeHtml(s.artist)}</div>
                <div class="tags">
                  ${s.category ? `<span class="tag">${escapeHtml(s.category)}</span>` : `<span class="tag">未分类</span>`}
                  <span class="tag">${(s.annotations || []).length} 词批注</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>`;
  }

  // 跳转学习页
  function goLearn(id) {
    currentSongId = id;
    currentView = 'learn';
    render();
  }

  /* ============================================================
   * 第六部分：前台 · 单曲学习页
   *   包含：B站视频播放器、歌词区、留言板
   * ============================================================ */
  function renderLearn(app, songId) {
    const song = loadSongs().find(s => s.id === songId);
    if (!song) {
      app.innerHTML = `
        <div class="layout">
          ${buildSidebarHtml()}
          <div>
            <div class="empty-state">
              <div class="big">😕</div>
              <div>歌曲不存在 <button class="btn btn-ghost btn-sm" onclick="goHome()">返回首页</button></div>
            </div>
          </div>
        </div>`;
      return;
    }

    // 中文名单行翻译数组（按 \n 切分，便于中英对照）
    const enLines = (song.lyrics || '').split('\n');
    const zhLines = (song.lyricsZh || '').split('\n');

    app.innerHTML = `
      <div class="layout">
        ${buildSidebarHtml()}
        <div>
          <div class="learn-header">
            <button class="btn btn-ghost btn-sm back" onclick="goHome()">← 返回列表</button>
            <h1>${escapeHtml(song.title)}</h1>
            <div class="artist">${escapeHtml(song.artist)} · ${escapeHtml(getCategoryDisplayName(song.category))}</div>
          </div>

          <!-- ===== B站视频播放器（极简缩小版，关闭弹幕） ===== -->
          <div class="players">
            <div class="player-box">
              <div class="label"><span class="dot" style="background:#fb7299"></span>B站视频播放器</div>
              <div class="bili-wrap">
                <iframe src="${buildBiliSrc(song.bilibiliBV)}"
                        scrolling="no" border="0" frameborder="no"
                        framespacing="0" allowfullscreen="true"
                        sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
              </div>
              <div class="fallback" id="biliFallback">
                ⚠️ B站视频加载失败？可前往 B 站搜索
                <a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(song.title + ' ' + song.artist)}"
                   target="_blank" rel="noopener">📺 去 B 站搜索</a>
              </div>
            </div>
          </div>

          <!-- ===== 歌词区 ===== -->
          <div class="lyrics-toolbar">
            <div class="mode-switch">
              <button class="${lyricsMode === 'bilingual' ? 'active' : ''}" onclick="setLyricsMode('bilingual')">中英对照</button>
              <button class="${lyricsMode === 'en' ? 'active' : ''}" onclick="setLyricsMode('en')">纯英文</button>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="copyLyrics()">📋 复制歌词</button>
          </div>
          <div class="lyrics-box" id="lyricsBox">
            ${renderLyricsHtml(song, enLines, zhLines)}
          </div>

          <!-- ===== 留言板（Supabase 云端） ===== -->
          <div class="msg-board">
            <h2>💬 留言区 <span style="font-size:12px;color:var(--text-soft);font-weight:400">（云端共享，匿名发布）</span></h2>
            <div class="msg-form">
              <input type="text" id="msgNick" class="nick" placeholder="昵称（必填，2-20字）" maxlength="20" />
              <textarea id="msgContent" placeholder="写下你对这首歌的感想、学习心得..." maxlength="500"></textarea>
              <div class="actions">
                <button class="btn btn-primary btn-sm" onclick="submitMessage()">提交留言</button>
              </div>
            </div>
            <div class="msg-list" id="msgList">
              <div class="msg-loading">留言加载中...</div>
            </div>
          </div>
        </div>
      </div>`;

    // 渲染后初始化播放器检测 + 加载留言
    setupPlayerFallbackDetection(song);
    loadMessages(song.id);
  }

  // 构造 B站 iframe src：关闭弹幕、隐藏多余信息、自动暂停起始
  function buildBiliSrc(bv) {
    if (!bv) return 'about:blank';
    // 参数说明：danmaku=0 关弹幕；high_quality=1 高清；as=0 不自动播放
    // 页面参数 page=1，不显示登录态
    return `https://player.bilibili.com/player.html?bvid=${encodeURIComponent(bv)}&page=1&danmaku=0&high_quality=1&as=0`;
  }

  // 播放器加载失败检测：B站 iframe 加载失败时展示兜底按钮
  function setupPlayerFallbackDetection(song) {
    const iframe = document.querySelector('.bili-wrap iframe');
    const bfb = document.getElementById('biliFallback');
    if (iframe) {
      iframe.addEventListener('error', () => bfb && bfb.classList.add('show'));
      // 若 BV 号为空直接显示兜底
      if (!song.bilibiliBV) bfb && bfb.classList.add('show');
    }
  }

  // 渲染歌词 HTML：高亮批注单词，支持中英对照/纯英文
  function renderLyricsHtml(song, enLines, zhLines) {
    const annos = song.annotations || [];
    // 构建一个 word -> anno 的映射表（按词长度降序，避免短词先匹配）
    const annoMap = {};
    annos.forEach(a => { if (a.word) annoMap[a.word.toLowerCase()] = a; });
    const words = Object.keys(annoMap).sort((a, b) => b.length - a.length);

    let html = '';
    enLines.forEach((line, idx) => {
      if (!line.trim()) { html += '<div class="lyrics-line">&nbsp;</div>'; return; }
      // 对当前行进行单词高亮处理（大小写不敏感）
      let processed = escapeHtml(line);
      words.forEach(w => {
        const re = new RegExp(escapeRegExp(w), 'gi');
        processed = processed.replace(re, (m) => {
          const a = annoMap[w];
                  return `<span class="hl ${a.level || 'basic'}" onclick="showAnno('${a.id}', event)">${m}</span>`;
        });
      });
      const zh = lyricsMode === 'bilingual' ? (zhLines[idx] || '') : '';
      html += `<div class="lyrics-line">${processed}${zh ? `<span class="zh">${escapeHtml(zh)}</span>` : ''}</div>`;
    });
    return html;
  }

  // 切换歌词显示模式
  function setLyricsMode(mode) {
    lyricsMode = mode;
    render();
  }
  // 复制歌词到剪贴板
  function copyLyrics() {
    const song = loadSongs().find(s => s.id === currentSongId);
    if (!song) return;
    const text = (song.lyrics || '') + (song.lyricsZh ? '\n\n—— 中文翻译 ——\n' + song.lyricsZh : '');
    navigator.clipboard.writeText(text).then(() => {
      toast('歌词已复制到剪贴板', 'success');
    }).catch(() => {
      toast('复制失败，请手动选择文本', 'error');
    });
  }

  // 显示批注弹窗
  function showAnno(annoId, evt) {
    const song = loadSongs().find(s => s.id === currentSongId);
    if (!song) return;
    const a = (song.annotations || []).find(x => x.id === annoId);
    if (!a) return;
    document.getElementById('annoWord').textContent = a.word || '';
    document.getElementById('annoPhon').textContent = a.phonetic || '';
    const body = document.getElementById('annoBody');
    let rows = '';
    if (a.meaning) rows += `<div class="row"><div class="k">释义</div><div class="v">${escapeHtml(a.meaning)}</div></div>`;
    if (a.grammar) rows += `<div class="row"><div class="k">语法</div><div class="v">${escapeHtml(a.grammar)}</div></div>`;
    if (a.collocation) rows += `<div class="row"><div class="k">搭配</div><div class="v">${escapeHtml(a.collocation)}</div></div>`;
    if (a.example) rows += `<div class="row"><div class="k">例句</div><div class="v">${escapeHtml(a.example)}</div></div>`;
    body.innerHTML = rows;

    // 定位弹窗：优先使用事件的坐标，其次使用触发元素的边界
    const pop = document.getElementById('annoPop');
    pop.classList.add('show');
    let x = 100, y = 100;
    const e = evt || window.event;
    if (e && e.clientX !== undefined && e.clientY !== undefined) {
      x = e.clientX; y = e.clientY;
    } else {
      // 尝试找到带有该 onclick 的元素并使用其位置
      const el = document.querySelector(`.hl[onclick*="${annoId}"]`);
      if (el && el.getBoundingClientRect) {
        const r = el.getBoundingClientRect();
        x = r.left + r.width / 2; y = r.top + r.height;
      }
    }

    // 防止超出右边/下边
    const pw = pop.offsetWidth || 280, ph = pop.offsetHeight || 150;
    if (x + pw > window.innerWidth - 10) x = window.innerWidth - pw - 10;
    if (y + ph > window.innerHeight - 10) y = window.innerHeight - ph - 10;
    pop.style.left = (x + 8) + 'px';
    pop.style.top = (y + 8) + 'px';
  }
  function hideAnnoPop() {
    document.getElementById('annoPop').classList.remove('show');
  }
  // 点击页面空白处关闭弹窗
  document.addEventListener('click', e => {
    const pop = document.getElementById('annoPop');
    if (!pop.classList.contains('show')) return;
    if (e.target.closest('.hl') || e.target.closest('.anno-pop')) return;
    hideAnnoPop();
  });

  function goHome() {
    currentView = 'home';
    render();
  }

  /* ============================================================
   * 第七部分：Supabase 留言板逻辑
   *   表结构（在 Supabase 后台执行 SQL 建表，见文末教程）：
   *     messages(
   *       id uuid primary key default gen_random_uuid(),
   *       song_id text not null,           -- 歌曲ID，用于隔离
   *       nickname text not null,          -- 昵称
   *       content text not null,           -- 留言内容
   *       created_at timestamptz default now()
   *     )
   * ============================================================ */

  /* ---------- Supabase 常见错误码解析（用户可看懂的中文提示） ---------- */
  function parseSupabaseError(err) {
    const code = err && err.code;
    const msg = (err && err.message) || '未知错误';
    // 自定义：歌曲/分类云端写入失败（详见 saveSongs 逻辑）
    if (code === 'CLOUD_WRITE_FAIL') {
      return { level: 'warning', title: '部分歌曲写入云端失败',
        hint: '最常见原因：1) songs 表未建或 write_song RPC 不存在 → 请执行文末教程三的建表+建函数 SQL；2) 网络不稳 → 稍后重试。本次已写入本地缓存，不会丢失。' };
    }
    // PGRST 系列是 PostgREST 返回码（Supabase REST API 底层）
    switch (code) {
      case 'PGRST205':
      case '42P01':  // PostgreSQL: relation does not exist
        return { level: 'critical', title: '⚠️ 表不存在',
          hint: '如果是 messages 表：执行文末教程二的 SQL；如果是 songs/categories 表或 write_song 函数不存在：执行文末教程三的建表+分类+3 个 SECURITY DEFINER 存储过程 SQL' };
      case 'PGRST301':
      case 'PGRST401':
      case '42501':  // PostgreSQL: permission denied
        return { level: 'critical', title: '🔐 权限不足（RLS 策略缺失）',
          hint: 'messages 表 RLS: create policy "任何人可读留言" on messages for select using (true); create policy "任何人可发布留言" on messages for insert with check (true); songs/categories 表 RLS: create policy "任何人可读歌曲" on songs for select using (true); create policy "任何人可读分类" on categories for select using (true); 写入通过 SECURITY DEFINER RPC，不需要 insert policy' };
      case 'PGRST116':
        return { level: 'warning', title: '列不存在或类型不匹配',
          hint: 'messages 表需要：id(uuid) / song_id(text) / nickname(text) / content(text) / created_at(timestamptz)；songs 表需要：id(text, pk) / title / artist / category / bilibili_bv / lyrics / lyrics_zh / annotations(jsonb) / created_at / updated_at' };
      case '23514':  // PostgreSQL: check constraint violation
        return { level: 'warning', title: '字段校验失败',
          hint: '昵称或内容可能为空或超长' };
      case '22P02':  // invalid uuid
        return { level: 'warning', title: 'ID 格式错误',
          hint: '请删除旧数据重试，或确保 id 使用 UUID 类型' };
    }
    // RPC / 存储过程错误
    if (code === 'P0001' || msg.includes('password') || msg.includes('管理员')) {
      return { level: 'critical', title: '🔐 管理员密码校验失败',
        hint: '请确保代码中的 ADMIN_PASSWORD 与 Supabase 存储过程 delete_message_admin / write_song / delete_song / replace_all_categories 里的密码完全一致（见文末教程）' };
    }
    if (msg.includes('function') && msg.includes('does not exist')) {
      return { level: 'critical', title: '🧩 RPC 函数不存在',
        hint: '请在 Supabase SQL Editor 执行文末教程二和教程三的完整 SQL（包含 messages/留言/歌曲/分类 3个 SECURITY DEFINER 函数）' };
    }
    if (msg.includes('execute') && msg.includes('permission')) {
      return { level: 'critical', title: '🔐 RPC 执行权限不足',
        hint: '请执行 grant execute on function delete_message_admin(uuid, text) to anon, authenticated; 同样对 write_song / delete_song / replace_all_categories 也 grant execute' };
    }
    // 网络层错误
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
      return { level: 'critical', title: '🌐 网络连接失败',
        hint: '请检查网络，确认已用 Live Server（http://）而不是 file:// 打开页面' };
    }
    if (msg.includes('JWT') || msg.includes('token') || msg.includes('401') || msg.includes('invalid') && msg.toLowerCase().includes('key')) {
      return { level: 'critical', title: '🔑 Anon Key 无效',
        hint: '请检查代码顶部 SUPABASE_ANON_KEY 是否正确复制，或 Supabase 后台 → Project Settings → API 重新生成 anon key' };
    }
    return { level: 'error', title: '❌ ' + msg, hint: '' };
  }
  function formatSupabaseErrorHtml(err, songId) {
    const info = parseSupabaseError(err);
    const color = info.level === 'warning' ? '#d97706' : 'var(--danger)';
    return `
      <div class="msg-empty" style="color:${color}">
        ${escapeHtml(info.title)}<br/>
        ${info.hint ? `<span style="font-size:12px;display:block;margin-top:4px">${escapeHtml(info.hint)}</span>` : ''}
        ${songId ? `<span style="font-size:11px;opacity:.75;display:block;margin-top:6px">调试信息：当前歌曲 song_id = ${escapeHtml(String(songId))}（可在 Supabase SQL Editor 执行 select * from messages where song_id = '${escapeHtml(String(songId))}' 验证数据是否存在）</span>` : ''}
      </div>`;
  }

  /* ---------- 表可用性探测（加载失败时自动检测是否表不存在） ---------- */
  async function probeMessagesTable(client) {
    try {
      const { error } = await client.from('messages').select('id', { count: 'exact', head: true }).limit(1);
      if (!error) return { ok: true };
      return { ok: false, error };
    } catch (e) { return { ok: false, error: e }; }
  }

  // 加载某首歌的全部留言（按时间倒序）
  async function loadMessages(songId) {
    const listEl = document.getElementById('msgList');
    if (!listEl) return;

    const client = initSupabase();
    if (!client) {
      listEl.innerHTML = `
        <div class="msg-empty">
          💡 留言板需配置 Supabase 密钥才能启用<br/>
          <span style="font-size:12px">请见文末教程，将 SUPABASE_URL 与 SUPABASE_ANON_KEY 填入代码顶部</span>
        </div>`;
      return;
    }

    listEl.innerHTML = '<div class="msg-loading">留言加载中...</div>';
    try {
      const { data, error } = await client
        .from('messages')
        .select('id, nickname, content, created_at')
        .eq('song_id', songId)
        .order('created_at', { ascending: false });
      if (error) throw error;
      console.log(`[留言加载] song_id=${songId}，共 ${data ? data.length : 0} 条`);
      renderMessages(data || []);
    } catch (e) {
      console.error('loadMessages 错误：song_id=' + songId, e);
      // 额外探测：区分表不存在 vs 其他错误
      const probe = await probeMessagesTable(client);
      let errToUse = e;
      if (!probe.ok && (probe.error && (probe.error.code === 'PGRST205' || probe.error.code === '42P01' || probe.error.code === 'PGRST301'))) {
        errToUse = probe.error;
      }
      listEl.innerHTML = formatSupabaseErrorHtml(errToUse, songId);
    }
  }

  // 渲染留言列表
  function renderMessages(messages) {
    const listEl = document.getElementById('msgList');
    if (!listEl) return;
    if (messages.length === 0) {
      listEl.innerHTML = '<div class="msg-empty">还没有留言，快来抢沙发吧 🌟</div>';
      return;
    }
    listEl.innerHTML = messages.map(m => `
      <div class="msg-item">
        <div class="head">
          <span class="nick">${escapeHtml(m.nickname)}</span>
          <span class="time">${formatTime(m.created_at)}</span>
          ${isAdmin ? `<button class="del" onclick="deleteMessage('${m.id}')">删除</button>` : ''}
        </div>
        <div class="body">${escapeHtml(m.content)}</div>
      </div>
    `).join('');
  }

  // 提交留言（匿名，无需登录）
  async function submitMessage() {
    const nickEl = document.getElementById('msgNick');
    const contentEl = document.getElementById('msgContent');
    if (!nickEl || !contentEl) return;
    const nickname = nickEl.value.trim();
    const content = contentEl.value.trim();
    if (nickname.length < 2) { toast('请输入至少2个字的昵称', 'error'); return; }
    if (!content) { toast('留言内容不能为空', 'error'); return; }
    if (content.length > 500) { toast('留言不能超过500字', 'error'); return; }

    const client = initSupabase();
    if (!client) { toast('Supabase 未配置，无法提交', 'error'); return; }

    toast('正在发布留言...', '');
    try {
      // 写入前预检：探测表是否可访问
      const probe = await probeMessagesTable(client);
      if (!probe.ok) throw probe.error;

      const { error } = await client.from('messages').insert([
        { song_id: currentSongId, nickname, content }
      ]);
      if (error) throw error;
      contentEl.value = '';
      await loadMessages(currentSongId);
      toast('留言发布成功 🎉', 'success');
    } catch (e) {
      console.error('submitMessage 错误：', e);
      const info = parseSupabaseError(e);
      toast('提交失败：' + info.title, 'error');
      if (info.hint) toast('提示：' + info.hint, 'error');
    }
  }

  // 删除留言（仅管理员）——服务端密码校验，调用 SECURITY DEFINER RPC
  async function deleteMessage(msgId) {
    if (!isAdmin) { toast('无权限', 'error'); return; }
    if (!confirm('确认删除这条留言？')) return;
    const client = initSupabase();
    if (!client) { toast('Supabase 未配置', 'error'); return; }
    try {
      // 注意：不使用 .from().delete() 直接删除（已被 RLS 禁止），
      // 改走 PostgreSQL 存储过程 delete_message_admin，在服务端校验密码
      const { data, error } = await client.rpc('delete_message_admin', {
        message_id: msgId,
        pwd: ADMIN_PASSWORD
      });
      if (error) throw error;
      if (data === null || data === 0) {
        throw new Error('RPC_NO_DELETE');
      }
      await loadMessages(currentSongId);
      toast('已删除', 'success');
    } catch (e) {
      console.error('deleteMessage 错误：', e);
      if (e && (e.message === 'RPC_NO_DELETE' || (e.code && e.code === 'P0001'))) {
        toast('删除失败：管理员密码不匹配，请检查 SQL 函数密码与代码 ADMIN_PASSWORD 是否一致', 'error');
      } else {
        const info = parseSupabaseError(e);
        toast('删除失败：' + info.title, 'error');
      }
    }
  }

  // 保存歌曲（新增或更新）
  function saveSong(id) {
    const title = document.getElementById('f_title').value.trim();
    const artist = document.getElementById('f_artist').value.trim();
    if (!title || !artist) { toast('歌名和歌手必填', 'error'); return; }
    // 分类：优先使用文本框（用户手动填写的真实值），并在需要时自动加入分类列表
    let category = (document.getElementById('f_category_text') || {}).value || '';
    category = category.trim();
    // 若用户填的新分类不在列表中，自动追加
    if (category && !isVirtualCategory(category)) {
      const cats = loadCategories();
      if (!cats.includes(category)) {
        cats.push(category);
        saveCategories(cats);
      }
    }
    const data = {
      title,
      artist,
      category,
      bilibiliBV: document.getElementById('f_bilibiliBV').value.trim(),
      lyrics: document.getElementById('f_lyrics').value,
      lyricsZh: document.getElementById('f_lyricsZh').value,
    };
    const list = loadSongs();
    if (id) {
      // 更新
      const idx = list.findIndex(s => s.id === id);
      if (idx >= 0) {
        list[idx] = Object.assign({}, list[idx], data);
        saveSongs(list);
        toast('歌曲已更新', 'success');
      }
    } else {
      // 新增
      data.id = uid();
      data.annotations = [];
      list.push(data);
      saveSongs(list);
      toast('歌曲已添加', 'success');
    }
    adminTab = 'songs';
    render();
  }

    // 1. 先本地立刻删除（UI 上响应快）
    const list = loadSongs().filter(s => s.id !== id);
    _songsCache = list.slice();
    safeLocalSet(STORE_KEY, JSON.stringify(list));
    render();
    toast('本地已删除，同步云端中...', '');
    // 2. 管理员时尝试云端删除
    if (isAdmin && initSupabase()) {

      if (res.ok) {

      } else {
        // 删除失败：如果用户想继续就 toast 提示，不回滚（本地已经删了，下次启动同步时云端会再出现）
        toast('⚠️ 云端删除失败，请检查网络或稍后重试', 'error');

      toast('已删除（非管理员：仅删除本地浏览器缓存，不影响云端）', 'success');

  function saveAnno(annoId) {
    const data = {
      word: document.getElementById('a_word').value.trim(),
      phonetic: document.getElementById('a_phonetic').value.trim(),
      meaning: document.getElementById('a_meaning').value.trim(),
      grammar: document.getElementById('a_grammar').value.trim(),
      collocation: document.getElementById('a_collocation').value.trim(),
      example: document.getElementById('a_example').value.trim(),
      level: document.getElementById('a_level').value,
    };
    if (!data.word) { toast('单词不能为空', 'error'); return; }
    const list = loadSongs();
    const idx = list.findIndex(s => s.id === annoEditSongId);
    if (idx < 0) return;
    if (!list[idx].annotations) list[idx].annotations = [];
    if (annoId) {
      const ai = list[idx].annotations.findIndex(x => x.id === annoId);
      if (ai >= 0) list[idx].annotations[ai] = Object.assign({ id: annoId }, data);
    } else {
      list[idx].annotations.push(Object.assign({ id: uid() }, data));
    }
    saveSongs(list);
    closeModal();
    toast('批注已保存', 'success');
    renderAdminPanel();
  }

  function deleteAnno(annoId) {
    if (!confirm('确认删除这条批注？')) return;
    const list = loadSongs();
    const idx = list.findIndex(s => s.id === annoEditSongId);
    if (idx < 0) return;
    list[idx].annotations = (list[idx].annotations || []).filter(a => a.id !== annoId);
    saveSongs(list);
    toast('已删除', 'success');
    renderAdminPanel();
  }

  // 后台删除留言（刷新整个留言管理列表）——服务端密码校验 RPC
  async function deleteMessageAdmin(msgId, songId) {
    if (!confirm('确认删除这条留言？')) return;
    const client = initSupabase();
    if (!client) { toast('Supabase 未配置', 'error'); return; }
    try {
      const { data, error } = await client.rpc('delete_message_admin', {
        message_id: msgId,
        pwd: ADMIN_PASSWORD
      });
      if (error) throw error;
      if (data === null || data === 0) throw new Error('RPC_NO_DELETE');
      toast('已删除', 'success');
      renderAdminPanel();
    } catch (e) {
      console.error('deleteMessageAdmin 错误：', e);
      if (e && (e.message === 'RPC_NO_DELETE' || (e.code && e.code === 'P0001'))) {
        toast('删除失败：管理员密码不匹配，请检查 SQL 函数密码', 'error');
      } else {
        const info = parseSupabaseError(e);
        toast('删除失败：' + info.title, 'error');
      }
    }
  }

  // 后台「一键修复重复歌曲」按钮逻辑：强制归一化 + 自动刷新页面
  function forceDedupSongs() {
    const before = loadSongs().length;
    const norm = normalizeSongs(loadSongs());
    if (!norm.changed) {
      toast(`✅ 当前没有检测到重复歌曲（共 ${before} 首）`, 'success');
      return;
    }
    saveSongs(norm.list);
    // 同归一化第 2 步：清理孤立分类
    const keptCats = new Set();
    for (const s of norm.list) if (s.category) keptCats.add(s.category);
    const sharedCatSet = new Set(SHARED_CATEGORIES || []);
    const curCats = loadCategories();
    const newCats = curCats.filter(c =>
      isVirtualCategory(c) || sharedCatSet.has(c) || keptCats.has(c)
    );
    if (newCats.length !== curCats.length) saveCategories(newCats);
    const merged = norm.list.length;
    const removed = before - merged;
    toast(`🔧 修复完成：合并 ${removed} 首重复，当前 ${merged} 首。刷新中...`, 'success');
    setTimeout(() => { render(); }, 600);
  }

  function exportJson() {
    const data = JSON.stringify(loadSongs(), null, 2);

    const a = document.createElement('a');
    a.href = url;
    a.download = `songs-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();

  function importJson() {
    const fileInput = document.getElementById('importFile');
    if (!fileInput.files[0]) { toast('请先选择文件', 'error'); return; }
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) throw new Error('JSON 必须是数组');
        const list = loadSongs();
        imported.forEach(ns => {
          const idx = list.findIndex(s => s.id === ns.id);
          if (idx >= 0) list[idx] = ns;
          else list.push(ns);
        });
        saveSongs(list);
        toast(`成功导入 ${imported.length} 首歌`, 'success');
        render();
      } catch (err) {
        toast('导入失败：' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  }

  /* ============================================================
   * 第九部分：工具函数
   * ============================================================ */
  // HTML 转义，防 XSS
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  // 属性值转义
  function escapeAttr(s) {
    return escapeHtml(s).replace(/`/g, '&#96;');
  }
  // 转义正则特殊字符
  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  // 格式化时间
  function formatTime(t) {
    if (!t) return '';
    const d = new Date(t);
    if (isNaN(d.getTime())) return '';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  /* ============================================================
