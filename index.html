   *
   * 二、Supabase 注册、建表、获取密钥（完整步骤）
   *    1. 访问 https://supabase.com 注册账号（可用 GitHub 登录）
   *    2. 点击 "New Project" 新建项目，填项目名、数据库密码、区域
   *       （区域选离自己近的，如 Southeast Asia (Singapore)）
   *    3. 等待 1-2 分钟项目初始化完成
   *    4. 进入项目左侧菜单 → "SQL Editor" → "New query"
   *       粘贴以下完整 SQL 并点击 "Run" 执行（包含建表、RLS 策略、
   *       删除留言用的 SECURITY DEFINER 函数）：
   *
   *       ------- 开始复制 -------
   *       -- 1) 建表
   *       create table if not exists messages (
   *         id uuid primary key default gen_random_uuid(),
   *         song_id text not null,
   *         nickname text not null,
   *         content text not null,
   *         created_at timestamptz default now()
   *       );
   *       -- 2) 索引
   *       create index if not exists messages_song_created_idx
   *         on messages(song_id, created_at desc);
   *       -- 3) 行级安全：只允许匿名读 / 匿名写，匿名直接删被禁止
   *       alter table messages enable row level security;
   *       drop policy if exists "任何人可读留言" on messages;
   *       drop policy if exists "任何人可发布留言" on messages;
   *       drop policy if exists "任何人可删除留言" on messages;
   *       create policy "任何人可读留言" on messages for select using (true);
   *       create policy "任何人可发布留言" on messages for insert with check (true);
   *       -- （故意不建 delete policy，所有匿名 .from().delete() 都会被数据库拒绝）
   *
   *       -- 4) 管理员删除用 SECURITY DEFINER 存储过程（服务端校验密码）
   *       create or replace function delete_message_admin(
   *         message_id uuid,
   *         pwd        text
   *       ) returns integer
   *       language plpgsql
   *       security definer     -- 以函数创建者（postgres）权限运行，绕过 RLS
   *       as $$
   *       declare
   *         ADMIN_PWD constant text := 'admin';  -- ★ 与本文件 ADMIN_PASSWORD 保持一致
   *         deleted_cnt integer;
   *       begin
   *         if pwd <> ADMIN_PWD then
   *           raise exception '管理员密码错误' using errcode = 'P0001';
   *         end if;
   *         delete from messages where id = message_id;
   *         get diagnostics deleted_cnt = row_count;
   *         return deleted_cnt;
   *       end;
   *       $$;
   *
   *       -- 5) 允许匿名调用上面的存储过程
   *       grant execute on function delete_message_admin(uuid, text)
   *         to anon, authenticated;
   *       ------- 结束复制 -------
   *
   *    5. 执行成功后，进入左侧菜单 → "Project Settings" → "API"
   *       复制 "Project URL" 和 "anon public" key
   *    6. 回到本文件顶部，找到两个变量：
   *           const SUPABASE_URL = '在此粘贴你的 Supabase Project URL';
   *           const SUPABASE_ANON_KEY = '在此粘贴你的 Supabase anon public key';
   *       分别粘贴替换。保存后刷新页面即可使用留言板。
   *
   *    ★ 已执行过旧版 SQL 的同学，如果 messages 表已经存在，只需在
   *      SQL Editor 再执行一次上面的第 4) 步函数 SQL 和第 3) 步的
   *      drop policy if exists "任何人可删除留言" on messages; 即可。
   *
   * 三、后台密码修改
   *    需要修改两处，保持一致：
   *      ① 本文件顶部的  const ADMIN_PASSWORD = 'admin';
   *      ② Supabase SQL Editor 中 delete_message_admin 函数里的
   *         ADMIN_PWD constant text := 'admin';
   *       （重新执行一次 create or replace function ... 那段 SQL 即可）
   *    登录态保存在 sessionStorage，关闭浏览器标签后需重新登录。
   *
   * 四、JSON 备份
   *    1. 后台 → "JSON 备份" 标签
   *    2. 点击 "导出 JSON" 会下载 songs-backup-YYYY-MM-DD.json
   *    3. 导入：选择 JSON 文件 → 点 "导入"，相同 ID 歌曲会被覆盖
   *    4. 也可直接在文本框编辑 JSON 后点 "应用文本框内容"
   *
   * 五、B 站 BV 号获取方法
   *    1. 打开 https://www.bilibili.com 搜索歌曲
   *    2. 进入视频播放页，地址栏形如：
   *         https://www.bilibili.com/video/BV1Gp4y1W7qg
   *       其中 BV1Gp4y1W7qg 就是 BV 号
   *    3. 填入后台歌曲表单的 "B 站视频 BV 号" 字段
   *    4. 内嵌播放器已默认关闭弹幕（danmaku=0），界面小巧
   *
   * 六、功能总览
   *    前台游客：
   *      - 歌曲列表 + 搜索
   *      - B站视频播放器（缩小版，关闭弹幕）
   *      - 播放失败兜底跳转 B 站搜索
   *      - 中英对照 / 纯英文歌词切换，一键复制
   *      - 单词高亮 + 悬浮批注弹窗（音标/释义/语法/搭配/例句）
   *      - 匿名留言（云端共享，按时间倒序）
   *    管理员后台（默认密码 admin）：
   *      - 歌曲管理：新增 / 编辑 / 删除
   *      - 批注编辑：每首歌独立批注，基础词/高级词分级
   *      - 留言管理：查看全部留言，可一键删除违规评论
   *      - JSON 备份导入导出
   *      - 📋 生成共享代码：一键把当前歌曲/分类导出为 JS 代码
   *    数据存储：
   *      - 歌曲数据 → 浏览器 localStorage（不丢失，不联网）
   *      - 留言数据 → Supabase 云端数据库（跨设备共享）
   *      - 音视频 → 直接调用 B 站官方接口，不存储文件
   *
   * ============================================================
   * 七、（推荐！云端优先）把歌曲/分类也迁到 Supabase 云端
   *    ============================================================
   *    这样以后你在后台加/改/删歌曲，**所有人立刻能看到**，
   *    不需要生成 JSON → 粘贴 → 上传 GitHub 这套流程。
   *    ------------------------------------------------------------
   *    原理：
   *      - 启动时先查 Supabase 的 songs 表读取所有歌曲（读云端）
   *      - 管理员后台新增/修改/删除时调用 PostgreSQL SECURITY DEFINER
   *        存储过程（在服务端校验管理员密码）写回云端
   *      - Supabase 不可用时自动降级读 localStorage（离线兜底）
   *      - SHARED_SONGS 自动作为种子写入 songs 空表（首次启动）
   *    ------------------------------------------------------------
   *    操作：在 Supabase 项目 → SQL Editor → New query，
   *         把下列整段 SQL 复制进去，点「运行」（Run）。
   *    ------- 开始复制（教程三：歌曲/分类表 + 3 个 RPC 函数）-------
   *       -- 1. 歌曲表
   *       create table if not exists songs (
   *         id text primary key,            -- 前端 uid() 生成的 ID
   *         title text not null,            -- 歌名
   *         artist text not null,           -- 歌手
   *         category text,                  -- 分类名
   *         bilibili_bv text,               -- B站 BV 号
   *         lyrics text,                    -- 英文歌词（\n 换行）
   *         lyrics_zh text,                 -- 中文翻译
   *         annotations jsonb default '[]', -- 批注 JSON 数组
   *         created_at timestamptz default now(),
   *         updated_at timestamptz default now()
   *       );
   *       create index if not exists songs_cat_idx on songs(category);
   *
   *       -- 2. 分类表
   *       create table if not exists categories (
   *         id uuid primary key default gen_random_uuid(),
   *         name text not null unique,
   *         sort_order integer not null default 0,
   *         created_at timestamptz default now()
   *       );
   *
   *       -- 3. RLS：允许任何人读（管理员写操作通过 RPC，不需要写级 RLS）
   *       alter table songs enable row level security;
   *       alter table categories enable row level security;
   *       drop policy if exists "任何人可读歌曲" on songs;
   *       drop policy if exists "任何人可读分类" on categories;
   *       create policy "任何人可读歌曲" on songs for select using (true);
   *       create policy "任何人可读分类" on categories for select using (true);
   *
   *       -- 4. 管理员密码写死的 SECURITY DEFINER 函数（3 个）
   *       create or replace function write_song(
   *         pwd text, song_id text, song_title text, song_artist text,
   *         song_category text, song_bv text, song_lyrics text,
   *         song_lyrics_zh text, song_annotations jsonb
   *       ) returns void language plpgsql security definer as $$
   *       declare
   *         ADMIN_PWD constant text := '99058122Wamm';  -- ★ 和代码 ADMIN_PASSWORD 一致
   *       begin
   *         if pwd <> ADMIN_PWD then
   *           raise exception '管理员密码错误' using errcode = 'P0001';
   *         end if;
   *         insert into songs(id,title,artist,category,bilibili_bv,lyrics,lyrics_zh,annotations,updated_at)
   *         values (song_id,song_title,song_artist,song_category,song_bv,song_lyrics,song_lyrics_zh,song_annotations,now())
   *         on conflict (id) do update set
   *           title=excluded.title, artist=excluded.artist,
   *           category=excluded.category, bilibili_bv=excluded.bilibili_bv,
   *           lyrics=excluded.lyrics, lyrics_zh=excluded.lyrics_zh,
   *           annotations=excluded.annotations, updated_at=now();
   *       end; $$;
   *       grant execute on function write_song(text,text,text,text,text,text,text,text,jsonb)
   *         to anon, authenticated;
   *
   *       create or replace function delete_song(pwd text, song_id text)
   *       returns void language plpgsql security definer as $$
   *       declare
   *         ADMIN_PWD constant text := '99058122Wamm';
   *       begin
   *         if pwd <> ADMIN_PWD then
   *           raise exception '管理员密码错误' using errcode = 'P0001';
   *         end if;
   *         delete from songs where id = song_id;
   *       end; $$;
   *       grant execute on function delete_song(text, text) to anon, authenticated;
   *
   *       create or replace function replace_all_categories(pwd text, cat_names text[])
   *       returns void language plpgsql security definer as $$
   *       declare
   *         ADMIN_PWD constant text := '99058122Wamm';
   *       begin
   *         if pwd <> ADMIN_PWD then
   *           raise exception '管理员密码错误' using errcode = 'P0001';
   *         end if;
   *         delete from categories;
   *         for i in 1..array_length(cat_names, 1) loop
   *           insert into categories(name, sort_order)
   *           values (cat_names[i], i)
   *           on conflict (name) do update set sort_order = i;
   *         end loop;
   *       end; $$;
   *       grant execute on function replace_all_categories(text, text[])
   *         to anon, authenticated;
   *    ------- 结束复制 -------
   *    ------------------------------------------------------------
   *    ⚠️ 密码修改提示（每次改密码要同步 4 处）：
   *       1) 本文件顶部 JS 常量 ADMIN_PASSWORD
   *       2) Supabase delete_message_admin 函数（教程二的 SQL）
   *       3) write_song / delete_song 函数（上方 SQL）
   *       4) replace_all_categories 函数（上方 SQL）
   *
   * ============================================================
   * 八、云端优先模式下你如何更新网站？（再也不需要 JSON 了）
   *    ------------------------------------------------------------
   *    部署完成后，以后你要做的一切：
   *
   *    ▶️ 新增/修改歌曲：
   *      1. 打开网址（github.io 或 localhost 都行）
   *      2. 右下角 ⚙️ → 输入密码进后台 → 🎵 歌曲管理 / ➕ 新增歌曲
   *      3. 点「保存歌曲」→ 弹出 toast「本地已保存，同步云端中...」
   *      4. 几秒后再弹「云端同步：成功 N 首」✅ → 完成
   *         → 其他人（手机 / 其他电脑）刷新页面立刻看到新歌
   *
   *    ▶️ 分类管理：
   *      1. 后台 → 📚 分类管理 → 增/删/改/排序
   *      2. 自动同步 Supabase → 所有人刷新立刻看到相同分类
   *
   *    ▶️ 删除歌曲：
   *      1. 后台 → 🎵 歌曲管理 → 某歌右侧「删除」
   *      2. 确认 → 本地立刻删掉 → 调用 delete_song RPC 删云端
   *
   *    ▶️ 批注编辑：
   *      1. 后台 → 📝 批注编辑器 → 保存
   *      2. saveSongs 自动把整首歌 write_song RPC 写回云端
   *
   *    🚫 再也不需要做的事：
   *      - 生成共享代码
   *      - 粘贴到 index.html
   *      - 重新上传 GitHub（除非你改了样式/结构/功能代码，
   *        或者新增了歌曲后连 SHARED_SONGS 也想一并更新，
   *        作为以后换域名/数据库的备份用）
   *    ------------------------------------------------------------
   *    兜底：如果 Supabase 挂了或在离线环境打开
   *      页面会自动降级读取 localStorage 缓存
   *      （只要之前在这台浏览器打开过，就有缓存可看）
   *
   * ============================================================
   */
  </script>
